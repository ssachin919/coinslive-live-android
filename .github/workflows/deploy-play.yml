name: Deploy to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: Play Console track
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: Release status
        required: true
        default: draft
        type: choice
        options:
          - draft
          - completed
  push:
    tags:
      - "v*"

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    name: Build and upload AAB
    runs-on: ubuntu-latest
    outputs:
      track: ${{ steps.release_meta.outputs.track }}
      status: ${{ steps.release_meta.outputs.status }}
      version_name: ${{ steps.app_version.outputs.version_name }}
      version_code: ${{ steps.app_version.outputs.version_code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK (native debug symbols for Play)
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret KEYSTORE_BASE64. Encode your .jks/.keystore and add it as a repository secret."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/upload-keystore.jks"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed release bundle
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Prepare native debug symbols (fallback zip)
        id: native_symbols
        run: |
          # Prefer AGP-generated zip; otherwise zip merged native libs for the Play uploader.
          OUT_DIR="app/build/outputs/native-debug-symbols/release"
          OUT_ZIP="$OUT_DIR/native-debug-symbols.zip"
          mkdir -p "$OUT_DIR"
          if [ -f "$OUT_ZIP" ]; then
            echo "path=$OUT_ZIP" >> "$GITHUB_OUTPUT"
            echo "Found AGP native-debug-symbols.zip"
            exit 0
          fi
          SRC="$(find app/build/intermediates/merged_native_libs -type d -path '*/release/*/out/lib' 2>/dev/null | head -n1)"
          if [ -z "$SRC" ]; then
            SRC="$(find app/build/intermediates/merged_native_libs -type d -name lib 2>/dev/null | head -n1)"
          fi
          if [ -n "$SRC" ] && [ -d "$SRC" ]; then
            (cd "$SRC" && zip -r "$GITHUB_WORKSPACE/$OUT_ZIP" ./*)
            echo "path=$OUT_ZIP" >> "$GITHUB_OUTPUT"
            echo "Created native-debug-symbols.zip from $SRC"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning::No native debug symbols found to upload separately (AAB may still embed them)."
          fi

      - name: Upload mapping file
        uses: actions/upload-artifact@v4
        with:
          name: mapping-release
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Upload native debug symbols artifact
        if: steps.native_symbols.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: native-debug-symbols
          path: ${{ steps.native_symbols.outputs.path }}
          if-no-files-found: warn

      - name: Resolve Play track and status
        id: release_meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "track=${{ inputs.track }}" >> "$GITHUB_OUTPUT"
            echo "status=${{ inputs.status }}" >> "$GITHUB_OUTPUT"
          else
            echo "track=internal" >> "$GITHUB_OUTPUT"
            echo "status=completed" >> "$GITHUB_OUTPUT"
          fi

      - name: Read app version
        id: app_version
        run: |
          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode\s*=' app/build.gradle.kts | head -n1 | sed -E 's/[^0-9]//g')
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="${GITHUB_REF_NAME}"; fi
          if [ -z "$VERSION_CODE" ]; then VERSION_CODE="unknown"; fi
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: in.coinslive.live
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ steps.release_meta.outputs.track }}
          status: ${{ steps.release_meta.outputs.status }}
          # mappingFile is only present when R8 minify is enabled.
          # Native symbols: embedded in the AAB when NDK is present; also upload zip when available.
          debugSymbols: ${{ steps.native_symbols.outputs.path }}

  notify-sibling:
    name: Ask about iOS sibling release
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Open sibling release checklist issue
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ needs.deploy.outputs.version_name }}';
            const code = '${{ needs.deploy.outputs.version_code }}';
            const track = '${{ needs.deploy.outputs.track }}';
            const status = '${{ needs.deploy.outputs.status }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const actor = context.actor;
            const title = `Sibling release check: iOS after Android ${version}`;
            const body = [
              `Android **${version}** (versionCode **${code}**) was uploaded to Google Play.`,
              '',
              `- Track: \`${track}\``,
              `- Status: \`${status}\``,
              `- Workflow run: ${runUrl}`,
              `- Trigger: \`${context.eventName}\` / \`${context.ref}\``,
              '',
              'Before closing this issue, decide whether the **iOS** sibling should also ship:',
              '',
              '- [ ] Review FEATURE_PARITY.md for gaps to port first',
              '- [ ] Port any required user-facing features into [coinslive-live-ios](https://github.com/ssachin919/coinslive-live-ios)',
              '- [ ] Bump iOS marketing / build versions',
              '- [ ] Cut tag `ios-v*` (or run **iOS TestFlight** via `workflow_dispatch`)',
              '',
              `_Opened automatically after a successful Play upload. Assignee: @${actor}_`,
            ].join('\n');

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['sibling-release'],
              assignees: [actor],
            }).catch(async (err) => {
              console.warn('create with label/assignee failed, retrying bare:', err.message);
              return github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            });
            console.log(`Created issue #${issue.data.number}`);
