name: Deploy to Google Play

# Default destination: Closed testing (Play track `alpha`), status completed.
on:
  workflow_dispatch:
    inputs:
      track:
        description: Play Console track (alpha = Closed testing)
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - internal
          - beta
          - production
      status:
        description: Release status
        required: true
        default: completed
        type: choice
        options:
          - completed
          - draft
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "QA_TEST_PLAN.md"
      - "store-listing/**"
      - ".cursor/**"
      - ".github/workflows/promote-play.yml"

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    name: Build and upload AAB
    runs-on: ubuntu-latest
    # Allow manual runs; skip auto runs marked [skip play].
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit == null ||
      !contains(github.event.head_commit.message, '[skip play]')
    outputs:
      track: ${{ steps.release_meta.outputs.track }}
      status: ${{ steps.release_meta.outputs.status }}
      version_name: ${{ steps.app_version.outputs.version_name }}
      version_code: ${{ steps.app_version.outputs.version_code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret KEYSTORE_BASE64. Encode your .jks/.keystore and add it as a repository secret."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/upload-keystore.jks"

      - name: Ensure unique Play versionCode
        id: bump_code
        run: |
          set -euo pipefail
          FILE=app/build.gradle.kts
          CURRENT=$(grep -E 'versionCode\s*=' "$FILE" | head -n1 | sed -E 's/[^0-9]//g')
          COUNT=$(git rev-list --count HEAD)
          # Play requires a new versionCode for every upload. Use the max of
          # gradle, commit count, and a run-based floor so CI never collides.
          RUN_FLOOR=$((1000 + ${{ github.run_number }}))
          NEW="$CURRENT"
          if [ "$COUNT" -gt "$NEW" ]; then NEW="$COUNT"; fi
          if [ "$RUN_FLOOR" -gt "$NEW" ]; then NEW="$RUN_FLOOR"; fi
          if [ "$NEW" -le "$CURRENT" ]; then NEW=$((CURRENT + 1)); fi
          sed -i -E "s/versionCode = [0-9]+/versionCode = ${NEW}/" "$FILE"
          echo "Bump versionCode ${CURRENT} → ${NEW}"
          echo "version_code=${NEW}" >> "$GITHUB_OUTPUT"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed release bundle
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # ndkVersion in app/build.gradle.kts makes AGP download the NDK and embed
        # native SYMBOL_TABLE debug symbols into the AAB for Play Console.
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      # AAB is uploaded to Play Console only — do not retain a GitHub Actions copy.
      - name: Upload mapping file
        uses: actions/upload-artifact@v4
        with:
          name: mapping-release
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Resolve Play track and status
        id: release_meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "track=${{ inputs.track }}" >> "$GITHUB_OUTPUT"
            echo "status=${{ inputs.status }}" >> "$GITHUB_OUTPUT"
          else
            # Tags and pushes to main always go to Closed testing.
            echo "track=alpha" >> "$GITHUB_OUTPUT"
            echo "status=completed" >> "$GITHUB_OUTPUT"
          fi

      - name: Read app version
        id: app_version
        run: |
          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode\s*=' app/build.gradle.kts | head -n1 | sed -E 's/[^0-9]//g')
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="${GITHUB_REF_NAME}"; fi
          if [ -z "$VERSION_CODE" ]; then VERSION_CODE="${{ steps.bump_code.outputs.version_code }}"; fi
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: in.coinslive.live
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ steps.release_meta.outputs.track }}
          status: ${{ steps.release_meta.outputs.status }}
          # mappingFile is only present when R8 minify is enabled.
          # Native debug symbols are embedded in the AAB via ndk.debugSymbolLevel.

  notify-sibling:
    name: Ask about iOS sibling release
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Open sibling release checklist issue
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ needs.deploy.outputs.version_name }}';
            const code = '${{ needs.deploy.outputs.version_code }}';
            const track = '${{ needs.deploy.outputs.track }}';
            const status = '${{ needs.deploy.outputs.status }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const actor = context.actor;
            const title = `Sibling release check: iOS after Android ${version}`;
            const body = [
              `Android **${version}** (versionCode **${code}**) was uploaded to Google Play **Closed testing** (\`alpha\`) unless another track was chosen.`,
              '',
              `- Track: \`${track}\``,
              `- Status: \`${status}\``,
              `- Workflow run: ${runUrl}`,
              `- Trigger: \`${context.eventName}\` / \`${context.ref}\``,
              '',
              'Before closing this issue, decide whether the **iOS** sibling should also ship:',
              '',
              '- [ ] Review FEATURE_PARITY.md for gaps to port first',
              '- [ ] Port any required user-facing features into [coinslive-live-ios](https://github.com/ssachin919/coinslive-live-ios)',
              '- [ ] Bump iOS marketing / build versions',
              '- [ ] Cut tag `ios-v*` (or run **iOS TestFlight** via `workflow_dispatch`)',
              '',
              `_Opened automatically after a successful Play upload. Assignee: @${actor}_`,
            ].join('\n');

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['sibling-release'],
              assignees: [actor],
            }).catch(async (err) => {
              console.warn('create with label/assignee failed, retrying bare:', err.message);
              return github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            });
            console.log(`Created issue #${issue.data.number}`);
